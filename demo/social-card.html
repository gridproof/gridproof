<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gridproof — social card</title>
<style>
:root {
  --bg:#0b0e13; --panel:#12161d; --line:#20262f;
  --text:#e6edf3; --muted:#8b949e; --faint:#5c6470;
  --error:#f85149; --warn:#d99a2b; --info:#589dff; --ok:#3fb950;
  --grid:rgba(255,255,255,0.035);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); font-family:var(--sans); }

.card {
  position:relative; width:1200px; height:630px;
  background:
    radial-gradient(circle at 80% 26%, rgba(88,157,255,0.10), transparent 55%),
    radial-gradient(circle at 8% 96%, rgba(63,185,80,0.06), transparent 50%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  background-size: auto, auto, 34px 34px, 34px 34px, auto;
}

.content {
  position:relative; z-index:1; display:flex;
  height:100%;
}

.left { flex:0 0 600px; display:flex; flex-direction:column; justify-content:center; padding:0 40px 0 64px; }
.logo { font-family:var(--mono); font-weight:700; font-size:84px; letter-spacing:-0.01em; color:var(--muted); margin-bottom:26px; }
.logo b { color:var(--text); }
.tagline { font-size:48px; line-height:1.22; color:var(--text); font-weight:500; letter-spacing:-0.01em; margin-bottom:24px; }
.tagline .hi { color:var(--ok); }
.sub { font-family:var(--mono); font-size:29px; color:var(--faint); line-height:1.35; }
.chipbar { display:flex; flex-wrap:wrap; gap:11px; margin-top:26px; }
.chip { font-family:var(--mono); font-size:25px; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 14px; background:rgba(255,255,255,0.015); }

/* Right half: the report interface itself, rendered 3x larger than the prior
   0.5 scale (=1.5) and cropped to its top-left corner — the panel is flush to
   the card's right/top/bottom edges, so only that corner is visible. */
.right {
  flex:0 0 600px; position:relative; overflow:hidden;
  border-left:1px solid var(--line); background:var(--panel);
}
.right::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(90deg, transparent 52%, var(--bg) 96%),
    linear-gradient(180deg, transparent 55%, var(--bg) 97%);
}
.right iframe {
  position:absolute; top:0; left:0; width:864px; height:900px; border:0;
  transform:scale(1.5); transform-origin:top left; pointer-events:none;
}
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="left">
        <div class="logo">grid<b>proof</b></div>
        <div class="tagline">Gridproof your UI — automated spacing &amp; grid QA <span class="hi">in the agent loop</span>.</div>
        <div class="sub">gp_audit(url) &rarr; JSON fix hints &rarr; agent edits &rarr; clean report</div>
        <div class="chipbar">
          <span class="chip">MCP server</span>
          <span class="chip">Tailwind-aware</span>
          <span class="chip">WCAG 2.5.8</span>
        </div>
      </div>
      <div class="right">
        <iframe src="demo-report-mobile.html" scrolling="no"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
